name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JWT_SECRET: careertrack-ci-jwt-secret-with-at-least-32-characters
  TOTP_ENCRYPTION_KEY: careertrack-ci-totp-key-with-at-least-32-characters

jobs:
  quality:
    name: Lint, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careertrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careertrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run isolated PostgreSQL integration
        run: npm run test:postgres
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/careertrack_ci

  browser:
    name: Security smoke and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Security smoke
        run: npm run test:security-smoke

      - name: Full E2E
        run: npx playwright test --workers=1

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            logs/
            screenshots/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
